  <meta charset="UTF-8">

<body style="background-color: #FDFAF6;">

  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container-fluid"
      style="background: linear-gradient(to right, rgb(30, 30, 30), rgb(70, 80, 190)); border-color: #FFC947;">
      <a href="./index.html"
        style="display: inline-block; padding: 10px; background-color: rgb(255, 191, 3); border-radius: 10px; box-shadow: 0 0 10px rgba(255, 191, 3, 0.7);">
        <img alt="Logo" src="../assets/images/FLICCPICKER.png" width="150" height="100" style="display: block;">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
        <div class="navbar-nav">
          <a class="nav-link" href="./index.html" style="color: rgb(245, 245, 245); transition: color 0.3s; font-size: 1.2rem;">Home</a>
          <a class="nav-link" href="./favorites.html" style="color: rgb(245, 245, 245); transition: color 0.3s; font-size: 1.2rem;">Favorites</a>
          <a class="nav-link" href="./about.html" style="color: rgb(245, 245, 245); transition: color 0.3s; font-size: 1.2rem;">About Us</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="card text-white mb-3 p-4 mx-auto" style="max-width: 720px; border: 1px solid rgba(0, 0, 0, 0.5); background: linear-gradient(to bottom, rgb(70, 80, 190), rgb(30, 30, 30)); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 style="color: rgb(255, 191, 3); margin: 0;">My Favorites</h1>
        <button id="clear-favorites" class="btn btn-warning">Clear Favorites</button>
      </div>
      <ul id="favorites-list" class="list-group list-group-flush"></ul>
      <p id="empty-message" style="color: rgb(245, 245, 245); display: none;">
        You haven't added any favorites yet. Head back to the
        <a href="./index.html" style="color: rgb(255, 191, 3);">home page</a> and pick some fliccs!
      </p>
    </div>
  </div>

  <footer>
    <div class="container d-flex justify-content-between">
      <div>
        <p style="margin: 0;"><a href="./about.html" class="text-white">About Us</a></p>
        <p style="margin: 0;"><a href="./favorites.html" class="text-white">Favorites</a></p>
      </div>
      <div>
        <a href="./index.html"
          style="display: inline-block; background-color: rgb(255, 191, 3); border-radius: 10px; box-shadow: 0 0 10px rgba(255, 191, 3, 0.7);">
          <img alt="Logo" src="../assets/images/FLICCPICKER.png" width="150" height="100" style="display: block;">
        </a>
      </div>
      <div>
        <p style="margin: 0;"><a href="./terms.html" class="text-white">Terms of Service</a></p>
        <p style="margin: 0;"><a href="./privacy.html" class="text-white">Privacy Policy</a></p>
        <p style="margin: 0;">&copy; 2023 FliccPicker</p>
      </div>
    </div>
  </footer>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script>
    $(document).ready(function () {
      function renderFavorites() {
        const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        const list = $('#favorites-list');
        list.empty();

        if (favorites.length === 0) {
          $('#empty-message').show();
          $('#clear-favorites').prop('disabled', true);
          return;
        }

        $('#empty-message').hide();
        $('#clear-favorites').prop('disabled', false);

        favorites.forEach(function (title) {
          const item = $('<li>', {
            class: 'list-group-item d-flex justify-content-between align-items-center',
            style: 'background-color: rgb(30, 30, 30); color: rgb(245, 245, 245); border-color: rgba(245, 245, 245, 0.2);'
          });
          item.append($('<span>').text(title));
          const removeBtn = $('<button>', {
            class: 'btn btn-sm btn-outline-warning',
            text: 'Remove'
          }).on('click', function () {
            removeFavorite(title);
          });
          item.append(removeBtn);
          list.append(item);
        });
      }

      function removeFavorite(title) {
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        favorites = favorites.filter(function (t) { return t !== title; });
        localStorage.setItem('favorites', JSON.stringify(favorites));
        renderFavorites();
      }

      $('#clear-favorites').on('click', function () {
        localStorage.removeItem('favorites');
        renderFavorites();
      });

      renderFavorites();
    });
  </script>
</body>

</html>
